name: docker-builder

# The sole publisher of the pinned toolchain used by local containers and CI.
# The hash covers the Dockerfile and ADD inputs; each revision keeps its own tag.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .ci/dockerfile-hash.yaml
      - docker/build.Dockerfile
      - docker/sources.list
      - docker/llvm-snapshot.key
      - .github/workflows/docker-builder.yaml
  push:
    branches:
      - "**"
    paths:
      - .ci/dockerfile-hash.yaml
      - docker/build.Dockerfile
      - docker/sources.list
      - docker/llvm-snapshot.key
      - .github/workflows/docker-builder.yaml

concurrency:
  group: docker-builder-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY_IMAGE: ghcr.io/izumoe/streamplace

jobs:
  builder:
    # Same-repository branches already build and publish on push.
    if:
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    name: builder image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Maximize build space
        run:
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          /opt/hostedtoolcache/CodeQL

      - name: Check out code
        uses: actions/checkout@v4.1.7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute tags
        id: tags
        run: |
          short=${GITHUB_SHA::7}
          hash=$(sed -n 's/^[[:space:]]*DOCKERFILE_HASH:[[:space:]]*//p' .ci/dockerfile-hash.yaml | head -1)
          test -n "$hash"
          echo "tags=${REGISTRY_IMAGE}:builder,${REGISTRY_IMAGE}:builder-${short},${REGISTRY_IMAGE}:builder-${hash}" >> "$GITHUB_OUTPUT"

      - name: Build and push builder
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/build.Dockerfile
          target: builder
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          # Toolchain layers exceed the GitHub Actions cache size limit.
          cache-from:
            type=registry,ref=${{ env.REGISTRY_IMAGE }}:builder-buildcache
          cache-to: >-
            ${{ github.event_name != 'pull_request' &&
            format('type=registry,ref={0}:builder-buildcache,mode=max',
            env.REGISTRY_IMAGE) || '' }}
